
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Deep - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand">
                🌊 PORTAL BADACZA
            </a>

            <span class="text-light small">
                PROJEKT - KONIEC 5 KLASY
            </span>
        </div>
    </nav>

    <!-- LOGIN -->
    <main class="login-wrapper">

        <div class="login-card">

            <div class="shark-icon text-center">
                <img src="https://img.icons8.com/?size=100&id=103090&format=png&color=FFFFFF">
            </div>

            <h1 class="text-center fs-3">
                Witaj ponownie
            </h1>

            <p class="text-center text-secondary fs-6">
                Prosimy się zalogować na stronę
            </p>

            <form>

                <div class="mb-4">
                    <label class="form-label" for="i_mail">
                        Email address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="i_mail"
                        placeholder="Wprowadź swój email adres"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label" for="i_password">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="i_password"
                        placeholder="Wprowadź swoje hasło"
                    >
                </div>

                <button
                    type="button"
                    class="btn btn-login w-100 mt-4"
                >
                    ZALOGUJ
                </button>

            </form>

            <div class="text-center mt-4">
                <span class="text-secondary small">
                    Jesteś nowy?
                </span>

                <a href="#" class="register-link fw-bold">
                    Zarejestruj
                </a>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        TESTOWANIE APLIKACJI • JOANNA FOSZCZ
    </footer>

</body>
</html>
