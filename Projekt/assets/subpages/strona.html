<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../script/script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="container mt-5">

    <h1>Formularz użytkownika</h1>

    <form action="/wynik" method="POST">

        <div class="mb-3">
            <label class="form-label">Imię:</label>
            <input type="text" name="imie" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nazwisko:</label>
            <input type="text" name="nazwisko" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Wiek:</label>
            <input type="number" name="wiek" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">
            Wyślij
        </button>

    </form>

    <div class="mt-4">
        {{maincontent}}
    </div>

    <button class="btn btn-primary" id="test">Kliknij</button>
    <div id="miejsceNaKaruzele"></div>

</body>

</html>
